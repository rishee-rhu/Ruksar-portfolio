<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Rukhsar Khan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1E1E1E;
  --fg:#F0EDE8;
  --muted:#908880;
  --accent:#C87941;
  --accent-low:rgba(200,121,65,0.12);
  --surface:#282828;
  --rule:#383830;
  --heading-font:'Cormorant Garamond',serif;
  --body-font:'DM Sans',sans-serif;
  --max-w:1200px;
  --pad-x:5vw;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fg);font-family:var(--body-font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--heading-font);font-weight:600;line-height:1.15;color:var(--fg);}
a{color:var(--accent);text-decoration:none;transition:opacity 0.2s;}
a:hover{opacity:0.75;}
.container{max-width:var(--max-w);margin:0 auto;padding:0 var(--pad-x);}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 var(--pad-x);height:68px;display:flex;align-items:center;justify-content:space-between;background:rgba(30,30,30,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule);}
.nav-logo{font-family:var(--heading-font);font-size:20px;font-weight:600;color:var(--fg);letter-spacing:0.01em;}
.nav-logo span{color:var(--accent);}
.nav-back{font-size:13px;color:var(--muted);letter-spacing:0.04em;transition:color 0.2s;}
.nav-back:hover{color:var(--fg);}

/* HERO */
.blog-hero{padding:140px 0 72px;}
.section-label{font-family:var(--body-font);font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:block;}
.blog-hero h1{font-size:clamp(40px,6vw,72px);font-weight:600;margin-bottom:16px;letter-spacing:-0.01em;}
.blog-hero p{font-size:17px;color:var(--muted);max-width:520px;line-height:1.7;}

/* POSTS GRID */
.posts-section{padding:0 0 100px;}
.posts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
.post-card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:36px 32px;transition:border-color 0.25s;display:flex;flex-direction:column;gap:16px;}
.post-card:hover{border-color:var(--accent);}
.post-card a{color:inherit;}
.post-meta{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.post-title{font-family:var(--heading-font);font-size:26px;font-weight:600;line-height:1.2;color:var(--fg);transition:color 0.2s;}
.post-card:hover .post-title{color:var(--accent);}
.post-summary{font-size:14px;color:var(--muted);line-height:1.7;}
.post-read{font-size:12px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);margin-top:auto;padding-top:8px;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 0;color:var(--muted);font-family:var(--heading-font);font-style:italic;font-size:22px;}

/* FOOTER */
.footer{background:#141414;border-top:1px solid var(--rule);padding:40px var(--pad-x);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;}
.footer-logo{font-family:var(--heading-font);font-size:18px;font-weight:600;color:var(--fg);}
.footer-logo span{color:var(--accent);}
.footer-copy{font-size:12px;color:var(--muted);}

@media(max-width:768px){
  .posts-grid{grid-template-columns:1fr;}
  .blog-hero{padding:120px 0 56px;}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Rukhsar <span>Khan</span></a>
  <a href="/" class="nav-back">← Back to Portfolio</a>
</nav>

<section class="blog-hero">
  <div class="container">
    <span class="section-label">Notes & Thinking</span>
    <h1>From the Field</h1>
    <p>Ops frameworks, VA lessons, and things startup founders wish someone had told them earlier.</p>
  </div>
</section>

<section class="posts-section">
  <div class="container">
    <div class="posts-grid" id="posts-grid">
      <div class="empty-state">Posts loading...</div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-logo">Rukhsar <span>Khan</span></div>
  <div class="footer-copy">© 2025 Rukhsar Khan. All rights reserved.</div>
</footer>

<script>
  // Netlify Identity redirect
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

  // Load posts from the /posts/ folder via Jekyll-style front matter
  // Since this is a static site, we use a posts manifest approach
  async function loadPosts() {
    const grid = document.getElementById('posts-grid');
    try {
      const res = await fetch('/posts/manifest.json');
      if (!res.ok) throw new Error('No manifest');
      const posts = await res.json();
      if (!posts.length) {
        grid.innerHTML = '<div class="empty-state">No posts yet. First one coming soon.</div>';
        return;
      }
      grid.innerHTML = posts.map(post => `
        <div class="post-card">
          <div class="post-meta">${formatDate(post.date)}</div>
          <a href="/posts/${post.slug}.html">
            <div class="post-title">${post.title}</div>
          </a>
          <div class="post-summary">${post.summary || ''}</div>
          <a href="/posts/${post.slug}.html" class="post-read">Read →</a>
        </div>
      `).join('');
    } catch(e) {
      grid.innerHTML = '<div class="empty-state">No posts yet. First one coming soon.</div>';
    }
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  loadPosts();
</script>

</body>
</html>
